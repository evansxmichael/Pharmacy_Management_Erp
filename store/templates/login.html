<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XISHAAN PHARMACY - Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #f4f7f6; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-card { 
            border: none; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            overflow: hidden; 
            width: 100%; 
            max-width: 900px; 
        }
        .login-left { 
            background: linear-gradient(135deg, #008B8B, #005f5f); 
            color: white; 
            padding: 50px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .login-right { 
            padding: 50px; 
            background: white; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card login-card flex-row shadow-lg">
        
        <div class="col-md-5 login-left d-none d-md-flex">
            <h2><i class="fas fa-heartbeat me-2"></i>XISHAAN</h2>
            <p class="mt-3 opacity-75">Enterprise Pharmacy Management System.</p>
            
            <div class="mt-auto small">
                <i class="fas fa-shield-alt me-1"></i> Secure 256-bit Encrypted Portal
            </div>
        </div>
        
        <div class="col-md-7 login-right">
            <h3 class="fw-bold mb-4">Account Login</h3>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger small py-2 fade show" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-muted small fw-bold">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light">
                            <i class="fas fa-user text-muted"></i>
                        </span>
                        <input type="text" name="username" class="form-control bg-light" required autofocus>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light">
                            <i class="fas fa-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" class="form-control bg-light" required>
                    </div>
                </div>
                
                <button type="submit" class="btn w-100 fw-bold text-white py-2 shadow-sm" style="background-color: #008B8B;">
                    Secure Login <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
